# Render Blueprint for the Mitra Japan API (FastAPI).
# The service builds from the repo root because the API reads the shared data
# files in apps/web/src/data. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: mitra-japan-api
    runtime: python
    plan: free
    # The FAISS index is git-ignored, so the build embeds the corpus (downloads the ~465 MB e5 model once).
    buildCommand: pip install -r apps/api/requirements.txt && cd apps/api && python -m rag.ingest
    # --proxy-headers so rate limiting sees the visitor's IP, not Render's proxy.
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false # paste in the dashboard; leave empty to run in Demo mode
      - key: CORS_ORIGINS
        sync: false # e.g. https://mitra-japan.vercel.app
      - key: PLANNER_MODEL
        value: claude-sonnet-5-5
      - key: PLAN_RATE_PER_MINUTE
        value: '8'
      - key: CHAT_RATE_PER_MINUTE
        value: '30'
      - key: MITRA_ENV
        value: production # turns off the debug endpoints
